/* =====================================================
   DATE
===================================================== */

function getCurrentDate(){

  const now = new Date();

  const day =
    String(now.getDate()).padStart(2,"0");

  const month =
    String(now.getMonth()+1).padStart(2,"0");

  const year =
    now.getFullYear();

  let hours = now.getHours();

  const minutes =
    String(now.getMinutes()).padStart(2,"0");

  const ampm =
    hours >= 12 ? "PM" : "AM";

  hours =
    hours % 12 || 12;

  return `${day}/${month}/${year} ${hours}:${minutes} ${ampm}`;

}

/* =====================================================

===================================================== */

function createMatchCard(match){

    statusClass = "result";

  }


  const joined =
    joinedMatches.some(
      item => item.match.id === match.id
    );


  let buttonText = "JOIN";

  if(match.status === "ongoing"){
    buttonText = "VIEW";
  }

  if(joined){
    buttonText = "JOINED";
  }


  return `

  <div class="match">

    <div class="match-top">

      <div class="game">
        ${match.name}
      </div>

      <div class="status ${statusClass}">
        ${statusText}
      </div>

    </div>


    <h3>${match.title}</h3>


    <div class="match-time">
      🕒 ${match.time}
    </div>


    <div class="info">

      <div class="info-box">
        <div class="info-title">🏆 Prize pool</div>
        <div class="info-value">${match.prize}</div>
      </div>

      <div class="info-box">
        <div class="info-title">🎯 Per Kill</div>
        <div class="info-value">${match.kill}</div>
      </div>

      <div class="info-box">
        <div class="info-title">💰 Entry Fee</div>
        <div class="info-value">${match.entry}</div>
      </div>

    </div>


    <div class="info">

      <div class="info-box">
        <div class="info-title">Type</div>
        <div class="info-value">${match.type}</div>
      </div>

      <div class="info-box">
        <div class="info-title">Version</div>
        <div class="info-value">${match.version}</div>
      </div>

      <div class="info-box">
        <div class="info-title">Map</div>
        <div class="info-value">${match.map}</div>
      </div>

    </div>


    ${
      match.status === "result"

      ?

      `<button class="join"
          onclick="showResult('${match.id}')">
          VIEW RESULT
       </button>`

      :

      `<button class="join"
          onclick="openMatch('${match.id}')">
          ${buttonText}
       </button>`
    }

  `;

}

function loadHomeMatches(){

        <h3>No Upcoming Matches</h3>
        <p style="margin-top:8px">
          New matches will appear here.
        </p>
      </div>
    `;

    return;

  }


  container.innerHTML =
    upcoming
      .map(createMatchCard)
      .join("");

}


/* =====================================================
   FILTER MATCHES
===================================================== */

function filterMatches(type,button){

  document
    .querySelectorAll(".tab")
    .forEach(tab =>
      tab.classList.remove("active")
    );


  if(button){
    button.classList.add("active");
  }


  const container =
    document.getElementById("matchesList");

  if(!container) return;


  const filtered =
    matches.filter(m => m.status === type);


  if(filtered.length === 0){

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">🎮</div>

        <h3>No Matches Found</h3>

        <p style="margin-top:8px">
          New matches will appear here.
        </p>

      </div>

    `;

    return;

  }


  container.innerHTML =
    filtered
      .map(createMatchCard)
      .join("");

}


/* =====================================================
   PAGE NAVIGATION
===================================================== */

function openPage(page){

  document
    .querySelectorAll(".page")
    .forEach(p =>
      p.classList.remove("active")
    );


  const target =
    document.getElementById(page);


  if(!target) return;


  target.classList.add("active");


  document
    .querySelectorAll(".nav")
    .forEach(n =>
      n.classList.remove("active")
    );


  const nav =
    document.querySelectorAll(".nav");


  if(page === "home" && nav[0])
    nav[0].classList.add("active");


  if(page === "matches" && nav[1])
    nav[1].classList.add("active");


  if(page === "myMatches" && nav[2])
    nav[2].classList.add("active");


  if(page === "profile" && nav[3])
    nav[3].classList.add("active");


  window.scrollTo({
    top:0,
    behavior:"instant"
  });


  if(page === "matches"){

    filterMatches(
      "ongoing",
      document.querySelectorAll(".tab")[0]
    );

  }


  if(page === "myMatches"){

    renderMyMatches();

  }


  if(page === "wallet"){

    updateWalletUI();
    loadTransactions();

  }

}


/* =====================================================
   OPEN MATCH
===================================================== */

function openMatch(id){

  const match =
    matches.find(m => m.id === id);


  if(!match) return;


  selectedMatch = match;


  if(joinedMatches.some(item => item.match.id === id)){

    alert(
      "You have already joined this match."
    );

    return;

  }


  document.getElementById("modalTitle")
    .innerText = match.name;


  document.getElementById("modalId")
    .innerText = match.title;


  document.getElementById("modalPrize")
    .innerText = match.prize;


  document.getElementById("modalKill")
    .innerText = match.kill;


  document.getElementById("modalEntry")
    .innerText = match.entry;


  document.getElementById("modalType")
    .innerText = match.type;


  document.getElementById("modalMap")
    .innerText = match.map;


  document
    .getElementById("matchModal")
    .classList.add("show");

}


/* =====================================================
   START JOIN
===================================================== */

function startJoin(){

  if(!selectedMatch) return;


  const entry =
    Number(
      selectedMatch.entry
        .replace("₹","")
        .trim()
    );


  const balance =
    getTotalBalance();


  if(balance < entry){

    closeModal("matchModal");


    alert(
      "Insufficient wallet balance.\n\n" +
      "Entry Fee: ₹" + entry +
      "\nYour Balance: ₹" + balance
    );


    return;

  }


  document
    .getElementById("matchModal")
    .classList.remove("show");


  document
    .getElementById("deductAmount")
    .innerText = entry;


  document
    .getElementById("confirmModal")
    .classList.add("show");

}

/* =====================================================
   SUBMIT JOIN
===================================================== */

function submitJoin(){

  const name =
    document
      .getElementById("playerName")
      .value
      .trim();


  const id =
    document
      .getElementById("playerId")
      .value
      .trim();


  if(!name){

    alert(
      "Please enter your Free Fire user name."
    );

    return;

  }


  if(!id){

    alert(
      "Please enter your Free Fire user ID."
    );

    return;

  }


  if(!selectedMatch) return;


  const entry =
    Number(
      selectedMatch.entry
        .replace("₹","")
        .trim()
    );


  if(getTotalBalance() < entry){

    closeModal("joinFormModal");

    alert("Insufficient wallet balance.");

    return;

  }


  /*
     ENTRY FEE IS DEDUCTED FROM WINNINGS
     FIRST.
  */

  let remaining = entry;


  if(wallet.winnings >= remaining){

    wallet.winnings -= remaining;

    remaining = 0;

  }else{

    remaining -= wallet.winnings;

    wallet.winnings = 0;

  }


  if(remaining > 0){

    if(wallet.deposit >= remaining){

      wallet.deposit -= remaining;

      remaining = 0;

    }else{

      remaining -= wallet.deposit;

      wallet.deposit = 0;

    }

  }


  joinedMatches.push({

    match:selectedMatch,

    playerName:name,

    playerId:id,

    joinedAt:getCurrentDate()

  });


  transactionList.unshift({

    type:"game-entry",

    title:selectedMatch.title,

    date:getCurrentDate(),

    status:"completed",

    amount:"₹" + entry

  });


  closeModal("joinFormModal");


  document.getElementById("playerName").value = "";

  document.getElementById("playerId").value = "";


  updateWalletUI();

  loadTransactions();

  loadHomeMatches();

  filterMatches(
    "ongoing",
    document.querySelectorAll(".tab")[0]
  );


  alert(
    "Join request submitted successfully!\n\n" +
    "Match: " + selectedMatch.title +
    "\nEntry Fee: ₹" + entry
  );


  renderMyMatches();

}

/* =====================================================
   LOCATION PERMISSION
===================================================== */

function requestLocationPermission(callback){

  if(!navigator.geolocation){

    alert(
      "Location permission is not supported on this device."
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      /*
         Permission granted.
         Location is intentionally not sent anywhere
         in this frontend-only version.
      */

      if(typeof callback === "function"){

        callback(position);

      }

    },

    function(error){

      if(error.code === 1){

        alert(
          "Location permission is required before withdrawal."
        );

      }else{

        alert(
          "Unable to get your location. Please try again."
        );

      }

    },

    {
      enableHighAccuracy:false,
      timeout:10000,
      maximumAge:60000
    }

  );

}


/* =====================================================
   WITHDRAW
===================================================== */

function withdrawDemo(){

  const upi =
    document
      .getElementById("upi")
      .value
      .trim();


  const holder =
    document
      .getElementById("holder")
      .value
      .trim();


  const amount =
    Number(
      document
        .getElementById("withdrawAmount")
        .value
    );


  if(!upi){

    alert(
      "Please enter your UPI ID."
    );

    return;

  }


  if(!holder){

    alert(
      "Please enter account holder name."
    );

    return;

  }


  if(!amount || amount <= 0){

    alert(
      "Please select a valid withdrawal amount."
    );

    return;

  }


  if(amount < 30){

    alert(
      "Minimum withdrawal amount is ₹30."
    );

    return;

  }


  if(amount > wallet.winnings){

    alert(
      "You can withdraw only from winnings.\n\n" +
      "Available winnings: ₹" +
      wallet.winnings
    );

    return;

  }


  /*
     Ask for location permission before
     proceeding with withdrawal request.
  */

  requestLocationPermission(function(){

    /*
       Frontend demo:
       Money is NOT actually transferred.
    */

    withdrawalRequests.unshift({

      upi:upi,

      holder:holder,

      amount:amount,

      date:getCurrentDate(),

      status:"pending"

    });


    transactionList.unshift({

      type:"withdraw",

      title:"Withdrawal Request",

      date:getCurrentDate(),

      status:"pending",

      amount:"₹" + amount

    });


    /*
       Don't deduct real winnings here because
       this frontend does not have a secure backend.
    */


    loadTransactions();


    alert(
      "Withdrawal request submitted.\n\n" +
      "Amount: ₹" + amount +
      "\nUPI: " + upi +
      "\nStatus: Pending"
    );


    document.getElementById("upi").value = "";

    document.getElementById("holder").value = "";

    document.getElementById("withdrawAmount").value = "";

  });

}


/* =====================================================
   WITHDRAWAL LIST
===================================================== */

function showWithdrawalList(){

  if(withdrawalRequests.length === 0){

    alert(
      "Withdrawal List\n\n" +
      "No withdrawal requests found."
    );

    return;

  }


  let text =
    "WITHDRAWAL LIST\n\n";


  withdrawalRequests.forEach(
    (item,index) => {

      text +=
        (index + 1) +
        ". ₹" + item.amount +
        "\n" +
        "UPI: " + item.upi +
        "\n" +
        "Status: " + item.status +
        "\n" +
        item.date +
        "\n\n";

    }
  );


  alert(text);

}
